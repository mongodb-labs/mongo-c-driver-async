name: Build and Test
on: [push, pull_request]

jobs:
  check-format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4
      - &get-uv
        name: Get UV
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.8.15
      - name: Check Formatting
        run: make format-check PYTHON_RUN="uv run --group=format"

  build-matrix:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from:
          # Alpine
          - alpine:3.19
          - alpine:3.20
          - alpine:3.21
          - alpine:3.22
          - alpine:latest
          - alpine:edge
          # Ubuntu
          - ubuntu:24.04
          - ubuntu:latest
          # Debian
          - debian:12.11
          - debian:latest
          - debian:unstable
          # GCC versions
          - gcc:15.2.0
          - gcc:14.3.0
          - gcc:13.4.0
          - gcc:12.5.0
          - gcc:latest
          # Clang versions
          - +env.llvm --llvm_major_version=19
          - +env.llvm --llvm_major_version=20
        vcpkg_arg: &vcpkg_arg
          - use_vcpkg=false
          - use_vcpkg=true
    steps:
      - *checkout
      - run: |
          bash tools/earthly.sh +build \
            --from=${{matrix.from}} \
            --${{matrix.vcpkg_arg}}
